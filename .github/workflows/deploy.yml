name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Lint Helm chart
        run: helm lint ./helm/

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install dclaw-secure ./helm/ \
            --namespace dclaw-core \
            --create-namespace \
            --set image.backend.tag=${{ inputs.image_tag }} \
            --set image.frontend.tag=${{ inputs.image_tag }} \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/dclaw-secure-backend -n dclaw-core --timeout=2m
          kubectl rollout status deployment/dclaw-secure-frontend -n dclaw-core --timeout=2m
