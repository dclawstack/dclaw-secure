# Default values = DEV / local cluster. Reproduces the live dclaw-core deployment.
# Plain `helm install dclaw-secure ./helm -n dclaw-core` brings the app up.
# For the cloud/GHCR deployment, override with: -f values-prod.yaml

nameOverride: ""

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-secure-backend
    tag: local
    pullPolicy: Never
  containerPort: 8031
  service:
    type: ClusterIP
    port: 8031
  env: {}
  livenessProbe:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 30
  readinessProbe:
    path: /health/
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-secure-frontend
    tag: local
    pullPolicy: Never
  containerPort: 3031
  service:
    type: NodePort
    port: 3031
    nodePort: 30031
  env: {}
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

secret:
  name: ""
  data:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_secure
    APP_ENV: production
    SECRET_KEY: dclaw-secure-local-secret-key

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []
